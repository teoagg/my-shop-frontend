AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Independent shop analytics with private reader and DynamoDB storage
Parameters:
  StrapiUrl:
    Type: String
    Default: https://api.tagg.gr
  AllowedOrigin:
    Type: String
    Default: https://shop.tagg.gr
Globals:
  Function:
    Runtime: nodejs22.x
    CodeUri: build/function/
    MemorySize: 256
    Timeout: 20
    Environment:
      Variables:
        EVENTS_TABLE: !Ref EventsTable
        STRAPI_URL: !Ref StrapiUrl
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        UPSTREAM_TIMEOUT_MS: '5000'
Resources:
  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  AnalyticsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
  Writer:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem]
              Resource: !GetAtt EventsTable.Arn
      Events:
        Track:
          Type: HttpApi
          Properties:
            ApiId: !Ref AnalyticsApi
            Path: /track
            Method: POST
        Options:
          Type: HttpApi
          Properties:
            ApiId: !Ref AnalyticsApi
            Path: /track
            Method: OPTIONS
  Reader:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.reader
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt EventsTable.Arn
  Summary:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.summary
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt EventsTable.Arn
      Events:
        ReadSummary:
          Type: HttpApi
          Properties:
            ApiId: !Ref AnalyticsApi
            Path: /summary
            Method: GET
        Options:
          Type: HttpApi
          Properties:
            ApiId: !Ref AnalyticsApi
            Path: /summary
            Method: OPTIONS
Outputs:
  TrackUrl:
    Value: !Sub 'https://${AnalyticsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/track'
  SummaryUrl:
    Value: !Sub 'https://${AnalyticsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/summary'
  ReaderArn:
    Value: !GetAtt Reader.Arn
  TableName:
    Value: !Ref EventsTable
